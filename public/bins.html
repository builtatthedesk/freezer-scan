<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Storage Bins</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#636b75; --line:#e2e5ea; --accent:#1f6feb; --chip:#eef1f5; --err:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --card:#181c22; --ink:#e8eaed; --muted:#9aa3ad; --line:#2a3038;
          --accent:#58a6ff; --chip:#232932; --err:#ff7b72; } }
  [hidden] { display:none !important; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  h2 { font-size:21px; margin:0; overflow-wrap:anywhere; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 12px; }
  a { color:var(--accent); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
  .search { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:2; }
  input, textarea { width:100%; font:inherit; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  textarea { min-height:90px; resize:vertical; }
  button, .btn { font:inherit; font-size:16px; padding:10px 16px; border-radius:10px; min-height:44px; cursor:pointer; border:1px solid var(--accent); background:transparent; color:var(--accent); display:inline-flex; align-items:center; gap:6px; }
  button.main, .btn.main { background:var(--accent); color:#fff; font-weight:600; }
  button.danger { border-color:var(--err); color:var(--err); }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .bin { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; text-align:left; padding:0; color:var(--ink); display:block; min-height:0; }
  .bin .pic { aspect-ratio:4/3; background:var(--chip); display:flex; align-items:center; justify-content:center; font-size:40px; }
  .bin .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .bin .t { font-weight:600; padding:8px 10px 0; overflow-wrap:anywhere; }
  .bin .m { color:var(--muted); font-size:13px; padding:2px 10px 10px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; color:var(--muted); }
  .note { color:var(--muted); font-size:14px; min-height:1.4em; margin:8px 0 0; }
  .note.err { color:var(--err); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 12px; }
  .head { display:flex; gap:10px; align-items:center; justify-content:space-between; margin:0 0 10px; }
  .photos { display:grid; gap:12px; }
  .photo { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .photo img { width:100%; display:block; background:var(--chip); min-height:120px; }
  .photo .cap { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 10px; color:var(--muted); font-size:14px; }
  .photo .cap button { min-height:36px; padding:4px 10px; font-size:14px; }
  .notes-view { white-space:pre-wrap; overflow-wrap:anywhere; }
  mark { background:#fff3a3; color:inherit; border-radius:3px; }
  @media (prefers-color-scheme: dark) { mark { background:#5a4b00; } }
  .camview { position:fixed; inset:0; z-index:50; background:#0b0f14; color:#fff; display:flex; flex-direction:column; gap:10px; padding:10px 12px calc(68px + env(safe-area-inset-bottom)); }
  .camview .box { position:relative; flex:1 1 auto; min-height:0; border-radius:12px; overflow:hidden; background:#000; }
  .camview video { width:100%; height:100%; object-fit:cover; display:block; }
  .camview .aim { position:absolute; left:50%; top:50%; width:min(62vw,62vh); aspect-ratio:1; transform:translate(-50%,-50%); border:3px solid rgba(255,255,255,.85); border-radius:14px; box-shadow:0 0 0 100vmax rgba(0,0,0,.35); pointer-events:none; }
  .camview .tip { position:absolute; left:0; right:0; bottom:10px; text-align:center; font-weight:600; text-shadow:0 1px 3px #000; }
  .camview button { color:#fff; border-color:rgba(255,255,255,.5); justify-content:center; }
/* Netlify's free plan pins a "Powered by Netlify" badge to the bottom corner: room so it covers nothing. */
@media screen { body::after { content:""; display:block; height:72px; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <h1>📦 Storage bins</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="bar">
      <button class="main" type="button" id="scan">📷 Scan a bin</button>
      <a class="btn" id="labels" href="label.html" hidden>Make bin labels</a>
      <a id="freezer" href="./">Freezers</a>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search, e.g. lights" autocomplete="off" aria-label="Search bins"></div>
    <div id="list"></div>
  </section>

  <section id="detail" hidden>
    <div class="head">
      <button type="button" id="back">‹ All bins</button>
      <button type="button" id="scan2">📷 Scan another</button>
    </div>
    <div class="card">
      <h2 id="d-name"></h2>
      <p class="sub" id="d-meta"></p>
      <div id="d-notes-view" class="notes-view"></div>
      <div id="d-edit" hidden>
        <label for="d-notes" class="sub">What's inside (a few words, so search can find it)</label>
        <textarea id="d-notes" maxlength="2000" placeholder="e.g. lights, extension cords, tree skirt"></textarea>
        <div class="bar" style="margin:10px 0 0">
          <button class="main" type="button" id="d-save">Save words</button>
          <label class="btn main" id="d-add">📷 Add photo<input id="d-file" type="file" accept="image/*" hidden></label>
        </div>
      </div>
      <p class="note" id="d-msg" role="status"></p>
    </div>
    <div class="photos" id="d-photos"></div>
    <div class="bar" id="d-admin" hidden style="margin-top:18px">
      <a class="btn" id="d-print" href="label.html">Print this label again</a>
      <button type="button" id="d-rename">Rename</button>
      <button type="button" class="danger" id="d-delete">Delete bin</button>
    </div>
  </section>
</div>

<div id="camview" class="camview" hidden role="dialog" aria-label="Scan a bin">
  <div class="box">
    <video id="cam-video" playsinline muted></video>
    <div class="aim"></div>
    <div class="tip" id="cam-tip">Point at a bin label</div>
  </div>
  <button type="button" id="cam-close">Cancel</button>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const LS = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
               set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

  // Same keys as the other pages: the scanning key (#w=) can change bins, the family
  // key (#k=) can only look. Either stays in the address and on this phone.
  const hashKey = (location.hash.match(/[#&]([wk])=([\w-]+)/) || []);
  if (hashKey[2] && hashKey[2] !== "demo") LS.set(hashKey[1] === "w" ? "fs.key" : "fl.key", hashKey[2]);
  const key = hashKey[2] || LS.get("fs.key") || LS.get("fl.key");
  const keyHash = hashKey[2] ? "#" + hashKey[1] + "=" + hashKey[2] : "";
  $("freezer").href = (hashKey[1] === "k" || (!hashKey[2] && !LS.get("fs.key")) ? "list.html" : "./") + keyHash;
  $("labels").href = "label.html" + keyHash;

  let bins = {}, canWrite = false, openId = null, demo = false;
  let notesDirty = false;      // typed words not saved yet: a refresh must not wipe them
  $("d-notes").addEventListener("input", () => { notesDirty = true; });

  async function api(method, path, body){
    const r = await fetch("/api/" + path, { method, cache: "no-store",
      headers: { "x-key": key, "content-type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    return j;
  }

  // Photos need the key header, so they come through fetch and are shown as blob URLs.
  const pics = new Map();
  function photoUrl(binId, pid, size){
    const k = binId + "/" + pid + "/" + size;
    if (!pics.has(k)) pics.set(k, fetch(`/api/photo/${encodeURIComponent(binId)}/${encodeURIComponent(pid)}?size=${size}`, { headers: { "x-key": key } })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b))
      .catch(e => { pics.delete(k); throw e; }));
    return pics.get(k);
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const day = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  // "Christmas 2" sorts before "Christmas 10".
  const byName = (a, b) => a[1].name.localeCompare(b[1].name, undefined, { numeric: true, sensitivity: "base" });

  async function load(){
    if (!key) { $("sub").textContent = "This link is missing its key. Open the bins from your freezer link."; $("list").innerHTML = ""; return; }
    try {
      const j = await api("GET", "bins");
      bins = j.bins || {}; canWrite = !!j.canWrite; demo = !!j.demo;
      $("labels").hidden = !canWrite;
      const n = Object.keys(bins).length;
      $("sub").textContent = (j.demo ? "Demo bins, reset every day. " : "") + (n === 1 ? "1 bin" : n + " bins") + (canWrite ? ". Scan a bin's label to see inside or add a photo." : ". Scan a bin's label to see what's inside.");
      renderList();
      if (openId) renderDetail();
    } catch (e) { $("sub").textContent = "Couldn't load the bins: " + e.message; }
  }

  function renderList(){
    const q = $("q").value.trim().toLowerCase();
    const rows = Object.entries(bins).filter(([, b]) => !q || (b.name + " " + (b.notes || "")).toLowerCase().includes(q)).sort(byName);
    const list = $("list");
    if (!Object.keys(bins).length) {
      list.innerHTML = '<div class="msg"><strong>No bins yet.</strong> ' + (canWrite ? 'Tap <b>Make bin labels</b>, type a name like Christmas and how many bins, print and stick them on. Then scan each bin and add a photo of what is inside.' : 'Nothing has been labelled yet.') + '</div>';
      return;
    }
    if (!rows.length) { list.innerHTML = '<div class="msg">No bin matches "' + esc(q) + '".</div>'; return; }
    const grid = document.createElement("div"); grid.className = "grid";
    for (const [id, b] of rows) {
      const card = document.createElement("button"); card.type = "button"; card.className = "bin";
      const pic = document.createElement("div"); pic.className = "pic"; pic.textContent = "📦";
      const latest = (b.photos || [])[0];
      if (latest) photoUrl(id, latest.id, "thumb").then(u => { const im = new Image(); im.src = u; im.alt = ""; pic.replaceChildren(im); }).catch(() => {});
      const t = document.createElement("div"); t.className = "t"; t.textContent = b.name;
      const m = document.createElement("div"); m.className = "m";
      m.textContent = b.notes || ((b.photos || []).length ? (b.photos.length === 1 ? "1 photo" : b.photos.length + " photos") : "No photo yet");
      card.append(pic, t, m);
      card.addEventListener("click", () => openBin(id));
      grid.append(card);
    }
    list.replaceChildren(grid);
  }
  $("q").addEventListener("input", renderList);

  // ---------------------------------------------------------------- one bin
  function openBin(id, replace){
    openId = id;
    const url = location.pathname + (keyHash ? keyHash + "&" : "#") + "bin=" + encodeURIComponent(id);
    if (replace) history.replaceState({ bin: id }, "", url); else history.pushState({ bin: id }, "", url);
    $("d-msg").textContent = ""; $("d-msg").classList.remove("err");
    notesDirty = false;
    renderDetail();
    window.scrollTo(0, 0);
  }
  function closeBin(){ openId = null; $("detail").hidden = true; $("home").hidden = false; renderList(); }
  window.addEventListener("popstate", () => {
    const m = location.hash.match(/[#&]bin=([\w.:-]+)/);
    if (m) { openId = m[1]; renderDetail(); } else closeBin();
  });
  $("back").addEventListener("click", () => { if (history.state && history.state.bin) history.back(); else { history.replaceState(null, "", location.pathname + keyHash); closeBin(); } });

  function renderDetail(){
    const b = bins[openId];
    $("home").hidden = true; $("detail").hidden = false;
    if (!b) {
      $("d-name").textContent = "Bin not found";
      $("d-meta").textContent = "This label isn't in the list (it may have been deleted).";
      $("d-notes-view").textContent = ""; $("d-edit").hidden = true; $("d-admin").hidden = true; $("d-photos").replaceChildren();
      return;
    }
    $("d-name").textContent = b.name;
    const n = (b.photos || []).length;
    $("d-meta").textContent = [n ? (n === 1 ? "1 photo" : n + " photos") : "No photo yet", b.updatedAt ? "updated " + day(b.updatedAt) : ""].filter(Boolean).join(" · ");
    $("d-notes-view").textContent = canWrite ? "" : (b.notes || "");
    $("d-edit").hidden = !canWrite; $("d-admin").hidden = !canWrite;
    if (canWrite && !notesDirty) $("d-notes").value = b.notes || "";
    $("d-print").href = "label.html" + (keyHash ? keyHash + "&" : "#") + "reprint=" + encodeURIComponent(openId);
    $("d-add").hidden = demo;
    if (demo && !$("d-msg").textContent) note("Photos are turned off in the demo; on your own copy, Add photo goes here.");
    const box = $("d-photos"); box.replaceChildren();
    (b.photos || []).forEach((p, i) => {
      const fig = document.createElement("div"); fig.className = "photo";
      const im = new Image(); im.alt = b.name + ", " + day(p.at);
      const bid = openId;
      photoUrl(bid, p.id, "thumb").then(u => { if (!im.src) im.src = u; }).catch(() => {});
      const full = () => photoUrl(bid, p.id, "full").then(u => { im.src = u; im.style.cursor = ""; }).catch(() => {});
      if (i === 0) full(); else { im.style.cursor = "zoom-in"; im.title = "Tap for full size"; im.addEventListener("click", full, { once: true }); }
      const cap = document.createElement("div"); cap.className = "cap";
      const when = document.createElement("span"); when.textContent = (i === 0 ? "Latest · " : "") + day(p.at);
      cap.append(when);
      if (canWrite) {
        const del = document.createElement("button"); del.type = "button"; del.className = "danger"; del.textContent = "Delete";
        del.addEventListener("click", () => deletePhoto(p.id));
        cap.append(del);
      }
      fig.append(im, cap); box.append(fig);
    });
  }

  function note(t, err){ $("d-msg").textContent = t; $("d-msg").classList.toggle("err", !!err); }

  $("d-save").addEventListener("click", async () => {
    const id = openId, b = bins[id]; if (!b) return;
    $("d-save").disabled = true;
    try { await api("PUT", "bins/" + encodeURIComponent(id), { name: b.name, notes: $("d-notes").value }); notesDirty = false; note("Saved."); await load(); }
    catch (e) { note("Not saved: " + e.message, true); }
    $("d-save").disabled = false;
  });
  $("d-rename").addEventListener("click", async () => {
    const id = openId, b = bins[id]; if (!b) return;
    const name = (prompt("New name for this bin (the printed label keeps the old name):", b.name) || "").trim();
    if (!name || name === b.name) return;
    try { await api("PUT", "bins/" + encodeURIComponent(id), { name, notes: $("d-notes").value }); notesDirty = false; note("Renamed."); await load(); }
    catch (e) { note("Not renamed: " + e.message, true); }
  });
  $("d-delete").addEventListener("click", async () => {
    const id = openId, b = bins[id]; if (!b) return;
    if (!confirm(`Delete "${b.name}" and its photos? Its label will then show "not found".`)) return;
    try { await api("DELETE", "bins/" + encodeURIComponent(id)); delete bins[id]; $("back").click(); load(); }
    catch (e) { note("Not deleted: " + e.message, true); }
  });
  async function deletePhoto(pid){
    if (!confirm("Delete this photo?")) return;
    try { await api("DELETE", `bins/${encodeURIComponent(openId)}/photos/${encodeURIComponent(pid)}`); note("Photo deleted."); await load(); }
    catch (e) { note("Not deleted: " + e.message, true); }
  }

  // Phone photos are 3-10 MB; shrink to 1600 px (about 200-400 KB) plus a 400 px thumbnail.
  async function shrink(file, maxSide, quality){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("That file isn't a photo this browser can read.")); i.src = url; });
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", quality);
    } finally { URL.revokeObjectURL(url); }
  }
  $("d-file").addEventListener("change", async () => {
    const file = $("d-file").files[0]; $("d-file").value = "";
    const id = openId; if (!file || !bins[id]) return;
    note("Uploading photo…"); $("d-add").style.opacity = ".5";
    try {
      let full = await shrink(file, 1600, 0.75);
      if (full.length > 1.9e6) full = await shrink(file, 1280, 0.6);
      const thumb = await shrink(file, 400, 0.7);
      await api("POST", `bins/${encodeURIComponent(id)}/photos`, { full, thumb });
      note("Photo added."); await load();
    } catch (e) { note("Photo not added: " + e.message, true); }
    $("d-add").style.opacity = "";
  });

  // ---------------------------------------------------------------- camera
  // Reads a bin label (BIN: name / ID: ...) and opens that bin. Chrome on Android has
  // BarcodeDetector; anywhere else jsqr.js decodes the frames.
  let cam = null;
  async function qrReader(){
    if ("BarcodeDetector" in window) {
      try {
        if ((await BarcodeDetector.getSupportedFormats()).includes("qr_code")) {
          const d = new BarcodeDetector({ formats: ["qr_code"] });
          return async (video) => (await d.detect(video)).map(r => r.rawValue);
        }
      } catch {}
    }
    if (!window.jsQR) await new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "jsqr.js"; sc.onload = ok; sc.onerror = bad; document.head.append(sc); });
    const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently: true });
    return async (video) => {
      const w = video.videoWidth, h = video.videoHeight; if (!w) return [];
      const k = Math.min(1, 800 / Math.max(w, h)); c.width = Math.round(w * k); c.height = Math.round(h * k);
      x.drawImage(video, 0, 0, c.width, c.height);
      const r = window.jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "dontInvert" });
      return r ? [r.data] : [];
    };
  }
  const binIdOf = (raw) => { const m = /^\s*BIN:[\s\S]*?ID:\s*(\d{6}-\d{3,})/.exec(raw); return m ? m[1] : null; };
  async function openCam(){
    if (cam) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return alert("This browser can't use the camera. Try Chrome on the phone.");
    const me = cam = { stream: null, timer: 0 };
    try { me.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
    catch (e) { cam = null; return alert(e.name === "NotAllowedError" ? "Allow the camera for this page, then tap Scan again." : "Camera problem: " + (e.message || e.name)); }
    if (cam !== me) { me.stream.getTracks().forEach(t => t.stop()); return; }
    const video = $("cam-video");
    $("camview").hidden = false; document.body.style.overflow = "hidden";
    $("cam-tip").textContent = "Point at a bin label";
    video.srcObject = me.stream;
    try { await video.play(); } catch {}
    let read;
    try { read = await qrReader(); } catch { closeCam(); return alert("Camera scanning didn't load. Check the connection and try again."); }
    const tick = async () => {
      if (cam !== me) return;
      if (video.readyState >= 2) {
        let raws = [];
        try { raws = await read(video); } catch {}
        if (cam !== me) return;
        if (raws.length > 1) $("cam-tip").textContent = "One label at a time";
        else if (raws.length === 1) {
          const id = binIdOf(raws[0]);
          if (id) { try { navigator.vibrate && navigator.vibrate(60); } catch {} closeCam(); return openBin(id, !!openId); }
          $("cam-tip").textContent = "That's not a bin label";
        }
      }
      if (cam === me) me.timer = setTimeout(tick, 120);
    };
    tick();
  }
  function closeCam(){
    if (!cam) return;
    const me = cam; cam = null;
    clearTimeout(me.timer);
    if (me.stream) me.stream.getTracks().forEach(t => t.stop());
    $("cam-video").srcObject = null; $("camview").hidden = true; document.body.style.overflow = "";
  }
  $("scan").addEventListener("click", openCam);
  $("scan2").addEventListener("click", openCam);
  $("cam-close").addEventListener("click", closeCam);
  document.addEventListener("visibilitychange", () => { if (document.hidden) closeCam(); else load(); });

  const start = location.hash.match(/[#&]bin=([\w.:-]+)/);
  // Opened straight on a bin (a scan from the freezer page): put the list underneath it,
  // so "All bins" and the phone's back button land on the list, not off the site.
  if (start && history.state && history.state.bin) openId = start[1];
  else if (start) { openId = start[1]; history.replaceState(null, "", location.pathname + keyHash); history.pushState({ bin: openId }, "", location.pathname + (keyHash ? keyHash + "&" : "#") + "bin=" + openId); }
  load();
})();
</script>
</body>
</html>
