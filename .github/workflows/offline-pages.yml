# Publishes the offline edition (offline/ + public/ pages) to GitHub Pages:
# https://builtatthedesk.github.io/freezer-scan/  -- open once on a phone, install, use offline.
# The site holds no data: each phone keeps its own list.
name: Offline edition to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["offline/**", "public/**", ".github/workflows/offline-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node offline/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-offline
      - id: deployment
        uses: actions/deploy-pages@v4
